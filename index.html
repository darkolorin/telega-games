<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Telegram Survivors</title>
  <!-- PixiJS instead of Phaser -->
  <script src="https://cdn.jsdelivr.net/npm/pixi.js@7.3.2/dist/pixi.min.js"></script>
  <!-- GSAP for animations -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.2/dist/gsap.min.js"></script>
  <!-- Telegram Games API -->
  <script src="https://telegram.org/js/games.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #1d1d1d;
      /* Prevent native scrolling/overscroll */
      overflow: hidden !important;
      overscroll-behavior: none;
      touch-action: none;
      height: 100vh; /* Fallback */
      height: 100dvh; /* Modern viewport units */
    }
    #game-container {
      width: 100vw;
      height: 100dvh;
      display: block;
    }
  </style>
</head>
<body>
  <div id="game-container"></div>

  <!-- Link external JS -->
  <script src="game.js"></script>

  <!-- Telegram Mini App helpers -->
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      if (window.Telegram && Telegram.WebApp) {
        try {
          if (Telegram.WebApp.disableVerticalSwipes) {
            Telegram.WebApp.disableVerticalSwipes();
            console.log('Disabled vertical swipes in Telegram Mini App.');
          }
        } catch (e) { console.warn('disableVerticalSwipes failed', e); }
      }
    });
  </script>
</body>
</html>
