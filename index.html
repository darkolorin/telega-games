<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Telegram Survivors</title>
  <!-- PixiJS instead of Phaser -->
  <script src="https://cdn.jsdelivr.net/npm/pixi.js@7.3.2/dist/pixi.min.js"></script>
  <!-- GSAP for animations -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.2/dist/gsap.min.js"></script>
  <!-- Telegram Games API -->
  <script src="https://telegram.org/js/games.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #1d1d1d;
      /* Prevent native scrolling/overscroll */
      overflow: hidden !important;
      overscroll-behavior: none;
      touch-action: none;
      /* Ensure we always cover the entire viewport */
      width: 100%;
      height: 100%;
      height: 100dvh; /* Modern viewport units */
    }
    /* Make sure the container itself always fills the screen */
    #game-container {
      position: fixed;
      inset: 0; /* top:0; right:0; bottom:0; left:0 */
      width: 100vw;
      height: 100vh; /* fallback */
      height: 100dvh;
      display: block;
      overflow: hidden;
      z-index: 1;
    }
    /* Force the Pixi canvas to stretch with the container */
    #game-container canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
      position: absolute;
      top: 0;
      left: 0;
    }
  </style>
</head>
<body>
  <div id="game-container"></div>

  <!-- Link external JS -->
  <script src="game.js"></script>

  <!-- Telegram Mini App helpers -->
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      if (window.Telegram && Telegram.WebApp) {
        try {
          // Tell Telegram we're ready ASAP
          if (Telegram.WebApp.ready) {
            console.log("Calling Telegram.WebApp.ready()");
            Telegram.WebApp.ready();
          }
          
          // Request fullscreen immediately on load
          if (Telegram.WebApp.requestFullscreen) {
            console.log("Calling Telegram.WebApp.requestFullscreen() on page load");
            Telegram.WebApp.requestFullscreen();
          } else if (Telegram.WebApp.expand) {
            console.log("Calling Telegram.WebApp.expand() on page load");
            Telegram.WebApp.expand();
          }
          
          if (Telegram.WebApp.disableVerticalSwipes) {
            Telegram.WebApp.disableVerticalSwipes();
            console.log('Disabled vertical swipes in Telegram Mini App.');
          }
        } catch (e) { console.warn('disableVerticalSwipes failed', e); }
      }
    });
  </script>
</body>
</html>
